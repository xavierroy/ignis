name: Sync upstream

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        run: |
          git remote add upstream https://github.com/Nystik-gh/ignis.git
          git fetch upstream main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B upstream-sync origin/main
          git merge --no-edit upstream/main

      - name: Open or update sync pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/sync-upstream
          base: main
          title: "Sync latest upstream changes"
          commit-message: "Merge latest upstream main"
          body: |
            Automated sync of `Nystik-gh/ignis` main into this fork.

            Review and merge this PR to carry upstream changes into the fork.
